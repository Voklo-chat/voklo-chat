<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voklo — 1-on-1 Anonymous Stranger Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --cyan: #06b6d4;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-size: 1.25rem; font-weight: 800; color: var(--cyan); letter-spacing: 0.5px; }
    .user-badge { font-size: 0.85rem; background: #334155; padding: 5px 12px; border-radius: 20px; }

    .status-bar {
      padding: 10px 16px; background: #162032; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .status-text { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
    .status-text.connected { color: #22c55e; }
    .status-text.waiting { color: #facc15; }

    .btn-next {
      background: var(--danger); color: white; border: none; padding: 7px 14px;
      border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .btn-next.find { background: var(--accent); }

    .messages {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .sys-msg {
      text-align: center; font-size: 0.82rem; color: var(--muted);
      background: rgba(51, 65, 85, 0.4); padding: 6px 12px; border-radius: 12px; align-self: center;
    }
    .msg {
      background: var(--panel); padding: 10px 12px; border-radius: 10px; max-width: 82%;
      border: 1px solid var(--border); word-wrap: break-word; align-self: flex-start;
    }
    .msg.mine { align-self: flex-end; background: #2e1065; border-color: var(--accent); }
    .msg-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
    .msg-user { font-weight: 700; font-size: 0.82rem; color: var(--cyan); }
    .msg.mine .msg-user { color: #c4b5fd; }
    .msg-time { font-size: 0.68rem; color: var(--muted); }
    .msg-text { font-size: 0.94rem; line-height: 1.4; }

    .input-bar {
      padding: 12px; background: var(--panel); border-top: 1px solid var(--border);
      display: flex; gap: 8px;
    }
    .input-bar input {
      flex: 1; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.95rem; outline: none;
    }
    .input-bar input:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-bar button {
      background: var(--accent); color: white; border: none; padding: 0 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.94);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px;
    }
    .modal h1 { font-size: 1.4rem; color: var(--cyan); }
    .modal p { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .modal input[type="text"] {
      padding: 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 1rem;
    }
    .check-row { display: flex; gap: 8px; align-items: flex-start; font-size: 0.8rem; color: #cbd5e1; }
    .modal button {
      background: var(--accent); color: white; border: none; padding: 12px;
      border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 18+ Login Modal -->
  <div class="modal-bg" id="loginModal">
    <div class="modal">
      <h1>Voklo 1-on-1 Chat</h1>
      <p>Talk privately with one random stranger at a time. Click "Next" anytime to switch.</p>
      <input type="text" id="nickInput" placeholder="Enter nickname (e.g. Kabir)" maxlength="20" />
      <label class="check-row">
        <input type="checkbox" id="ageCheck" />
        <span>I confirm I am 18+ years old and agree to follow respectful community guidelines.</span>
      </label>
      <button onclick="startApp()">Find a Stranger</button>
    </div>
  </div>

  <header>
    <div class="brand">VOKLO</div>
    <div class="user-badge" id="userBadge">Guest</div>
  </header>

  <div class="status-bar">
    <div class="status-text" id="statusText">Not connected</div>
    <button class="btn-next find" id="actionBtn" onclick="handleAction()">Find Stranger</button>
  </div>

  <div class="messages" id="messagesBox"></div>

  <form class="input-bar" onsubmit="sendMessage(event)">
    <input type="text" id="msgInput" placeholder="Type a message..." maxlength="500" autocomplete="off" disabled />
    <button type="submit" id="sendBtn" disabled>Send</button>
  </form>

  <script>
    const SUPABASE_URL = "https://tiuyhsabtguiwktcsoaw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mB9ygtWSe6dCo9GrR7kQlQ_6EpY_YoA";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const myId = "u_" + Math.random().toString(36).substring(2, 12);
    let nickname = "";
    let currentSessionId = null;
    let sessionState = "idle"; // idle | waiting | active
    let sessionSub = null;
    let msgSub = null;

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function addSystemMsg(text) {
      const box = document.getElementById("messagesBox");
      const div = document.createElement("div");
      div.className = "sys-msg";
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function setUI(state, label) {
      sessionState = state;
      const statusEl = document.getElementById("statusText");
      const btn = document.getElementById("actionBtn");
      const input = document.getElementById("msgInput");
      const sendBtn = document.getElementById("sendBtn");

      statusEl.textContent = label;
      statusEl.className = "status-text " + (state === "active" ? "connected" : state === "waiting" ? "waiting" : "");

      if (state === "active") {
        btn.textContent = "Next Stranger";
        btn.className = "btn-next";
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      } else if (state === "waiting") {
        btn.textContent = "Cancel";
        btn.className = "btn-next";
        input.disabled = true;
        sendBtn.disabled = true;
      } else {
        btn.textContent = "Find Stranger";
        btn.className = "btn-next find";
        input.disabled = true;
        sendBtn.disabled = true;
      }
    }

    function startApp() {
      const nick = document.getElementById("nickInput").value.trim();
      const is18 = document.getElementById("ageCheck").checked;
      if (nick.length < 2) return alert("Please enter a nickname (at least 2 characters).");
      if (!is18) return alert("You must confirm you are 18+ to enter.");

      nickname = nick;
      document.getElementById("userBadge").textContent = "👤 " + nickname;
      document.getElementById("loginModal").style.display = "none";
      findStranger();
    }

    async function handleAction() {
      if (sessionState === "active" || sessionState === "waiting") {
        await endCurrentSession(true);
      } else {
        await findStranger();
      }
    }

    function clearSubscriptions() {
      if (sessionSub) { db.removeChannel(sessionSub); sessionSub = null; }
      if (msgSub) { db.removeChannel(msgSub); msgSub = null; }
    }

    async function endCurrentSession(searchAgain) {
      clearSubscriptions();
      if (currentSessionId) {
        const oldId = currentSessionId;
        currentSessionId = null;
        await db.from("chat_sessions").update({ status: "ended" }).eq("id", oldId);
      }
      if (searchAgain) {
        await findStranger();
      } else {
        setUI("idle", "Disconnected");
      }
    }

    async function findStranger() {
      clearSubscriptions();
      document.getElementById("messagesBox").innerHTML = "";
      setUI("waiting", "Searching for a stranger...");
      addSystemMsg("Looking for someone online...");

      // 1. Check if someone is already waiting
      const { data: waitingList } = await db
        .from("chat_sessions")
        .select("*")
        .eq("status", "waiting")
        .neq("user1_id", myId)
        .order("created_at", { ascending: true })
        .limit(1);

      if (waitingList && waitingList.length > 0) {
        const target = waitingList[0];
        const { data: joined } = await db
          .from("chat_sessions")
          .update({ user2_id: myId, user2_nick: nickname, status: "active" })
          .eq("id", target.id)
          .eq("status", "waiting")
          .select()
          .single();

        if (joined) {
          connectToSession(joined.id, joined.user1_nick);
          return;
        }
      }

      // 2. Otherwise create a waiting room and wait for a stranger
      const { data: created, error } = await db
        .from("chat_sessions")
        .insert({ user1_id: myId, user1_nick: nickname, status: "waiting" })
        .select()
        .single();

      if (error || !created) {
        setUI("idle", "Connection error");
        addSystemMsg("Could not connect. Click Find Stranger to retry.");
        return;
      }

      currentSessionId = created.id;
      sessionSub = db
        .channel("session-" + created.id)
        .on("postgres_changes", {
          event: "UPDATE", schema: "public", table: "chat_sessions", filter: `id=eq.${created.id}`
        }, payload => {
          const updated = payload.new;
          if (updated.status === "active" && sessionState === "waiting") {
            connectToSession(updated.id, updated.user2_nick);
          } else if (updated.status === "ended" && sessionState === "active") {
            handleStrangerLeft();
          }
        })
        .subscribe();
    }

    function connectToSession(sessionId, strangerNick) {
      currentSessionId = sessionId;
      document.getElementById("messagesBox").innerHTML = "";
      setUI("active", "Connected with " + strangerNick);
      addSystemMsg("You are now chatting 1-on-1 with " + strangerNick + ". Say hi!");

      // Listen for disconnect if we joined as user2
      if (!sessionSub) {
        sessionSub = db
          .channel("session-" + sessionId)
          .on("postgres_changes", {
            event: "UPDATE", schema: "public", table: "chat_sessions", filter: `id=eq.${sessionId}`
          }, payload => {
            if (payload.new.status === "ended" && sessionState === "active") {
              handleStrangerLeft();
            }
          })
          .subscribe();
      }

      // Listen for live 1-on-1 messages
      msgSub = db
        .channel("msgs-" + sessionId)
        .on("postgres_changes", {
          event: "INSERT", schema: "public", table: "private_messages", filter: `session_id=eq.${sessionId}`
        }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }

    function handleStrangerLeft() {
      clearSubscriptions();
      currentSessionId = null;
      setUI("idle", "Stranger disconnected");
      addSystemMsg("Stranger has left the chat. Click 'Find Stranger' for a new match.");
    }

    function renderMessage(msg) {
      const box = document.getElementById("messagesBox");
      const div = document.createElement("div");
      div.className = "msg" + (msg.sender_id === myId ? " mine" : "");
      const time = new Date(msg.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      div.innerHTML = `
        <div class="msg-head">
          <span class="msg-user">${escapeHtml(msg.sender_nick)}</span>
          <span class="msg-time">${time}</span>
        </div>
        <div class="msg-text">${escapeHtml(msg.content)}</div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      if (sessionState !== "active" || !currentSessionId) return;

      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      await db.from("private_messages").insert({
        session_id: currentSessionId,
        sender_id: myId,
        sender_nick: nickname,
        content: text
      });
    }

    window.addEventListener("beforeunload", () => {
      if (currentSessionId) {
        db.from("chat_sessions").update({ status: "ended" }).eq("id", currentSessionId);
      }
    });
  </script>
</body>
</html>
